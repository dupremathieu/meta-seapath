cukinia_log "$(_colorize yellow "--- Check bootloader hardening ---")"

/usr/share/update/mount_boot.sh mount

boot_mounted() { mountpoint -q /boot; }

when "boot_mounted" \
id "SEAPATH-00007" as "systemd-boot EFI binary exists" cukinia_cmd \
    test -f /boot/EFI/BOOT/bootx64.efi

when "boot_mounted" \
id "SEAPATH-00077" as "boot partition has loader config" cukinia_cmd \
    test -f /boot/loader/loader.conf

when "boot_mounted" \
id "SEAPATH-00078" as "boot entries exist for both slots" cukinia_cmd \
    test -f /boot/loader/entries/seapath-slot-a.conf -a \
         -f /boot/loader/entries/seapath-slot-b.conf

when "boot_mounted" \
id "SEAPATH-00079" as "boot partition is vfat" cukinia_test \
    "$(stat -f -c %T /boot)" == "msdos"

/usr/share/update/mount_boot.sh umount 2>/dev/null
